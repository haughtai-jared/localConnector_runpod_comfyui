[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runpod-comfyui-mcp"
version = "0.1.0"
description = "Local MCP connector that renders ComfyUI workflows on Runpod serverless GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "runpod-comfyui-mcp contributors" }]
keywords = ["mcp", "runpod", "comfyui", "serverless", "stable-diffusion", "krea2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runpod-comfyui-mcp = "runpod_comfyui_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/haughtai-jared/localConnector_runpod_comfyui"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_comfyui_mcp"]

# Ship the sample workflow inside the wheel so an installed copy still has a
# working default. In a git checkout the repo-root `workflows/` folder is used.
[tool.hatch.build.targets.wheel.force-include]
"workflows/krea2_turbo_t2i.json" = "runpod_comfyui_mcp/workflows/krea2_turbo_t2i.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:runpod_comfyui_mcp.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
